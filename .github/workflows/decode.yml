name: decode-videos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in b64/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "$n"; done
          git rm -q -r b64
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add *.mp4 && git commit -m "Decode videos" && git push
